    group.add(roof(h, tiles));
  }
}

// A part of a house: pitched and hipped (0); a roof garden's grass (1); flat (2); an attic's (3),
// steeper, a gable at each end, dormers on its slopes — upright windows standing out of the roof;
// a terrace's paving (4).
function part(group, pt, tiles) {
  const cs = pt.corners;
  if (pt.roof === 1 || pt.roof === 2 || pt.roof === 4) {
    const shape = new THREE.Shape(cs.map(c => new THREE.Vector2(c[0], c[1])));
    const d = pt.roof === 4 ? 0.05 : 0.3;
    const m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false }), pt.roof === 1 ? MAT.lawn : MAT.stone);
    m.rotation.x = -Math.PI / 2; m.position.y = pt.top; group.add(m);
    return;
  }
  if (pt.roof !== 3) { group.add(roof(pt, tiles)); return; }
  const over = 0.4 + WALL / 2, cx = cs.reduce((s, c) => s + c[0], 0) / 4, cy = cs.reduce((s, c) => s + c[1], 0) / 4;
  const e0 = [cs[1][0] - cs[0][0], cs[1][1] - cs[0][1]], e1 = [cs[2][0] - cs[1][0], cs[2][1] - cs[1][1]];
  const l0 = Math.hypot(...e0), l1 = Math.hypot(...e1);
  const [la, lb, ua, ub] = l0 >= l1 ? [l0, l1, e0.map(v => v / l0), e1.map(v => v / l1)] : [l1, l0, e1.map(v => v / l1), e0.map(v => v / l0)];
  const A = la / 2 + over, B = lb / 2 + over, rise = 0.9 * B, top = pt.top;
  const P = (s, t, z) => [cx + ua[0] * s + ub[0] * t, z, -(cy + ua[1] * s + ub[1] * t)];
  const mesh = (tri, mat) => { const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(tri.flat(), 3)); g.computeVertexNormals(); const m = new THREE.Mesh(g, mat); group.add(m); };
  const quad = (a, b, c, d) => [a, b, c, a, c, d];
  const slopes = [...quad(P(-A, -B, top), P(A, -B, top), P(A, 0, top + rise), P(-A, 0, top + rise)),
                  ...quad(P(A, B, top), P(-A, B, top), P(-A, 0, top + rise), P(A, 0, top + rise))];
  const peak = top + rise * (lb / 2) / B, side = [], glass = [];
  for (const e of [-1, 1]) side.push(P(e * la / 2, -lb / 2, top), P(e * la / 2, lb / 2, top), P(e * la / 2, 0, peak));
  for (const d of pt.dormers || []) for (const e of [-1, 1]) {
    const tf = 0.6 * B * e, zb = top + rise * 0.4, zt = zb + 1.0, tb = Math.max(0, B * (1 - (zt - top) / rise)) * e;
    glass.push(...quad(P(d - 0.4, tf, zb + 0.2), P(d + 0.4, tf, zb + 0.2), P(d + 0.4, tf, zt - 0.15), P(d - 0.4, tf, zt - 0.15)));
    side.push(...quad(P(d - 0.55, tf, zb), P(d + 0.55, tf, zb), P(d + 0.55, tf, zb + 0.2), P(d - 0.55, tf, zb + 0.2)));
    side.push(...quad(P(d - 0.55, tf, zt - 0.15), P(d + 0.55, tf, zt - 0.15), P(d + 0.55, tf, zt), P(d - 0.55, tf, zt)));
    for (const q of [[-0.55, -0.4], [0.4, 0.55]]) side.push(...quad(P(d + q[0], tf, zb), P(d + q[1], tf, zb), P(d + q[1], tf, zt), P(d + q[0], tf, zt)));
    for (const q of [-0.55, 0.55]) side.push(P(d + q, tf, zb), P(d + q, tf, zt), P(d + q, tb, zt));
    slopes.push(...quad(P(d - 0.6, tf * 1.05, zt), P(d + 0.6, tf * 1.05, zt), P(d + 0.6, tb, zt), P(d - 0.6, tb, zt)));
  }
  mesh(slopes, tiles);
  mesh(side, new THREE.MeshLambertMaterial({ color: 0xe6dcc6, side: THREE.DoubleSide }));
  if (glass.length) mesh(glass, new THREE.MeshLambertMaterial({ color: 0x7fb8e6, side: THREE.DoubleSide }));
}

// A house round a court: its roof a ring, rising from the eaves outside to a ridge and down to the
// court; along the court a beam at every storey's top and a low wall on every upper floor.
function court(group, h, storeys, mat) {
  const O = h.corners, C = O.map(o => h.court.reduce((best, c) => Math.hypot(c[0] - o[0], c[1] - o[1]) < Math.hypot(best[0] - o[0], best[1] - o[1]) ? c : best));
  const tri = [];
  const P = (c, z) => [c[0], z, -c[1]];
  for (let i = 0; i < 4; i++) {
    const j = (i + 1) % 4, wide = Math.hypot(C[i][0] - O[i][0], C[i][1] - O[i][1]);
    const Ri = [(O[i][0] + C[i][0]) / 2, (O[i][1] + C[i][1]) / 2], Rj = [(O[j][0] + C[j][0]) / 2, (O[j][1] + C[j][1]) / 2];
    const zr = h.top + 0.3 * wide;
    tri.push(P(O[i], h.top), P(O[j], h.top), P(Rj, zr), P(O[i], h.top), P(Rj, zr), P(Ri, zr));
    tri.push(P(Ri, zr), P(Rj, zr), P(C[j], h.top), P(Ri, zr), P(C[j], h.top), P(C[i], h.top));
    const L = Math.hypot(C[j][0] - C[i][0], C[j][1] - C[i][1]), u = [(C[j][0] - C[i][0]) / L, (C[j][1] - C[i][1]) / L];
    for (let st = 0; st < storeys; st++) {
      const z0 = h.floor + st * STOREY;
      wallBox(group, C[i], u, -0.15, L + 0.15, z0 + STOREY - 0.35, z0 + STOREY, 0.3, MAT.wall);
      if (st > 0) wallBox(group, C[i], u, 0, L, z0, z0 + 0.9, 0.2, MAT.wall);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(tri.flat(), 3));
  geo.computeVertexNormals();
  group.add(new THREE.Mesh(geo, mat));
}

// A hipped roof on four corners, a flat one on more; 0.4 m over the walls.
function roof(h, mat) {
  const cs = h.corners, n = cs.length, over = 0.4 + WALL / 2;
  const cx = cs.reduce((s, c) => s + c[0], 0) / n, cy = cs.reduce((s, c) => s + c[1], 0) / n;
  if (n !== 4) {
    const shape = new THREE.Shape(cs.map(c => new THREE.Vector2(c[0], c[1])));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.y = h.top;
    return m;
  }
  const e0 = [cs[1][0] - cs[0][0], cs[1][1] - cs[0][1]], e1 = [cs[2][0] - cs[1][0], cs[2][1] - cs[1][1]];
  const l0 = Math.hypot(...e0), l1 = Math.hypot(...e1);
  const [la, lb, ua, ub] = l0 >= l1 ? [l0, l1, e0.map(v => v / l0), e1.map(v => v / l1)] : [l1, l0, e1.map(v => v / l1), e0.map(v => v / l0)];
  const A = la / 2 + over, B = lb / 2 + over, rise = 0.45 * lb, ridge = Math.max(0, A - B);
  const P = (s, t, z) => [cx + ua[0] * s + ub[0] * t, z, -(cy + ua[1] * s + ub[1] * t)];
  const c1 = P(-A, -B, h.top), c2 = P(A, -B, h.top), c3 = P(A, B, h.top), c4 = P(-A, B, h.top);
  const r1 = P(-ridge, 0, h.top + rise), r2 = P(ridge, 0, h.top + rise);
  const tri = [c1, c2, r2, c1, r2, r1, c3, c4, r1, c3, r1, r2, c2, c3, r2, c4, c1, r1].flat();
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(tri, 3));
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

const MARBLE = [0xd9453a, 0x3a7bd9, 0xe6b43a, 0x5fae4a, 0x9a5fd0, 0xe07a2f, 0x3fb6b0, 0xd95f9e, 0x8c8c94, 0xf2efe6];
// Where a marble is at time `ms`: on its way between the two stops round that moment, in a
// straight line; let go in the air it falls as a thing falls; it rolls with a hop over the ground
// no higher than a tenth of the way's length.  Before its first stop it is not there yet.
function marbleAt(way, ms) {
  if (!way.length || ms < way[0][0]) return null;
  let i = 0;
  while (i + 1 < way.length && way[i + 1][0] <= ms) i++;
  const a = way[i], b = way[Math.min(i + 1, way.length - 1)];
  const span = b[0] - a[0], f = span > 0 ? Math.min(1, (ms - a[0]) / span) : 1;
  let z = a[3] + (b[3] - a[3]) * f;
  if (i === 0 && a[1] === b[1] && a[2] === b[2]) z = a[3] + (b[3] - a[3]) * f * f;   // the fall
  return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f, z];
}

function thing(group, t) {
  const at = (m, x, y, z) => { m.position.set(x, z, -y); group.add(m); return m; };
  const k = t.kind;
  if (k === "pine") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.4, 6), MAT.trunk), t.x, t.y, t.z + 0.7);
    at(new THREE.Mesh(new THREE.ConeGeometry(1.3, 5, 8), MAT.pine), t.x, t.y, t.z + 3.6);
  } else if (k === "oak" || k === "autumn_oak") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 2.6, 6), MAT.trunk), t.x, t.y, t.z + 1.3);
    at(new THREE.Mesh(new THREE.SphereGeometry(2.0, 10, 8), k === "oak" ? MAT.oak : MAT.autumn), t.x, t.y, t.z + 3.8);
  } else if (k === "poplar" || k === "autumn_poplar") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.6, 6), MAT.trunk), t.x, t.y, t.z + 0.8);
    const m = at(new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), k === "poplar" ? MAT.poplar : MAT.autumn), t.x, t.y, t.z + 4.2);
    m.scale.set(0.9, 3.2, 0.9);
  } else if (k === "bush") {
    at(new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6), MAT.oak), t.x, t.y, t.z + 0.6);
  } else if (k === "garden_fence") {
    const m = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z + 0.5); m.scale.set(1.5, 1.0, 0.12);
  } else if (k === "village_well") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.0, 14), MAT.stone), t.x, t.y, t.z + 0.5);
  } else if (k === "pillar") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, t.size, 10), MAT.stone), t.x, t.y, t.z + t.size / 2);
  } else if (k === "gazebo_roof") {
    // a pointed roof on its pillars, a beam round under it
    const m = at(new THREE.Mesh(new THREE.ConeGeometry(t.size * 0.78, 1.6, 4), MAT.roof), t.x, t.y, t.z + 0.8);
    m.rotation.y = Math.PI / 4;
    const b = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z - 0.1); b.scale.set(t.size * 1.02, 0.2, t.size * 1.02);
  } else if (k === "bridge") {
    const m = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z - 0.15); m.scale.set(1.5, 0.3, 1.5);
  }
}

const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 2000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
let current = null;
const scenes = DATA.scenes.map(s => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xb9d6ec);
  scene.add(new THREE.HemisphereLight(0xe8f2ff, 0x5a5040, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-60, 120, 80); scene.add(sun);
  const group = new THREE.Group();
  group.add(groundMesh(s.ground));
  for (const h of s.houses) house(group, h);
  for (const t of s.things) thing(group, t);
  for (const f of s.fences || []) fence(group, s.ground, f);
  // marbles: a stone almost a hex wide each, played back along its way in time
  const balls = (s.marbles || []).map((way, i) => {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.68, 20, 14), new THREE.MeshLambertMaterial({ color: MARBLE[i % MARBLE.length] }));
    group.add(b);
    return { mesh: b, way };
  });
  let end = 0;
  for (const b of balls) for (const p of b.way) end = Math.max(end, p[0]);
  scene.add(group);
  // look at the middle of the ground, from the south-east above
  const g = s.ground, lk = (q, r) => 2 * q + (r & 1);
  const mx = (lk(g.q0, 0) + lk(g.q0 + g.w, 0)) / 2 * 0.75, my = (g.r0 + g.h / 2) * 3 * 0.4330127;
  const span = Math.max(g.w * 1.5, g.h * 1.3);
  return { name: s.name, scene, balls, end, target: new THREE.Vector3(mx, 3, -my), eye: new THREE.Vector3(mx + span * 0.35, span * 0.55, -my + span * 0.75) };
});
const ask = new URLSearchParams(location.search);
const vec = name => { const v = (ask.get(name) || "").split(",").map(Number); return v.length === 3 && v.every(isFinite) ? new THREE.Vector3(v[0], v[2], -v[1]) : null; };
let began = performance.now();
function show(i) {
  current = scenes[i];
  began = performance.now();
  camera.position.copy(vec("eye") || current.eye); controls.target.copy(vec("at") || current.target); controls.update();
  document.querySelectorAll("#buttons button").forEach((b, j) => b.classList.toggle("on", j === i));
}
const buttons = document.getElementById("buttons");
scenes.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.name; b.onclick = () => show(i); buttons.appendChild(b); });
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
show(Math.min(scenes.length - 1, Math.max(0, +(new URLSearchParams(location.search).get("scene") || 0))));
// the marbles' time: it runs, waits two seconds at the end and starts again; ?t=MS holds it still
const held = ask.get("t") === null ? null : +ask.get("t");
const note = document.getElementById("note"), words = note.textContent;
(function loop() {
  requestAnimationFrame(loop);
  if (current.balls.length) {
    let ms = held !== null ? held : performance.now() - began;
    if (held === null && ms > current.end + 2000) { began = performance.now(); ms = 0; }
    for (const b of current.balls) {
      const p = marbleAt(b.way, ms);
      b.mesh.visible = !!p;
      if (p) b.mesh.position.set(p[0], p[2] + 0.68, -p[1]);
    }
    note.textContent = (Math.min(ms, current.end) / 1000).toFixed(1) + " s of " + (current.end / 1000).toFixed(1) + " · " + words;
  } else if (note.textContent !== words) note.textContent = words;
  renderer.render(current.scene, camera);
})();
</script>
</body>
