// eases away from rest and into rest, and a turn of its way is rounded.

function thing(group, t) {
  const at = (m, x, y, z) => { m.position.set(x, z, -y); group.add(m); return m; };
  const k = t.kind;
  if (k === "pine") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.4, 6), MAT.trunk), t.x, t.y, t.z + 0.7);
    at(new THREE.Mesh(new THREE.ConeGeometry(1.3, 5, 8), MAT.pine), t.x, t.y, t.z + 3.6);
  } else if (k === "oak" || k === "autumn_oak") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 2.6, 6), MAT.trunk), t.x, t.y, t.z + 1.3);
    at(new THREE.Mesh(new THREE.SphereGeometry(2.0, 10, 8), k === "oak" ? MAT.oak : MAT.autumn), t.x, t.y, t.z + 3.8);
  } else if (k === "poplar" || k === "autumn_poplar") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.6, 6), MAT.trunk), t.x, t.y, t.z + 0.8);
    const m = at(new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), k === "poplar" ? MAT.poplar : MAT.autumn), t.x, t.y, t.z + 4.2);
    m.scale.set(0.9, 3.2, 0.9);
  } else if (k === "bush") {
    at(new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 6), MAT.oak), t.x, t.y, t.z + 0.6);
  } else if (k === "garden_fence") {
    const m = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z + 0.5); m.scale.set(1.5, 1.0, 0.12);
  } else if (k === "village_well") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.0, 14), MAT.stone), t.x, t.y, t.z + 0.5);
  } else if (k === "pillar") {
    at(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, t.size, 10), MAT.stone), t.x, t.y, t.z + t.size / 2);
  } else if (k === "gazebo_roof") {
    // a pointed roof on its pillars, a beam round under it
    const m = at(new THREE.Mesh(new THREE.ConeGeometry(t.size * 0.78, 1.6, 4), MAT.roof), t.x, t.y, t.z + 0.8);
    m.rotation.y = Math.PI / 4;
    const b = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z - 0.1); b.scale.set(t.size * 1.02, 0.2, t.size * 1.02);
  } else if (k === "bridge") {
    const m = at(new THREE.Mesh(BOX, MAT.wood), t.x, t.y, t.z - 0.15); m.scale.set(1.5, 0.3, 1.5);
  }
}

});
const ask = new URLSearchParams(location.search);
const vec = name => { const v = (ask.get(name) || "").split(",").map(Number); return v.length === 3 && v.every(isFinite) ? new THREE.Vector3(v[0], v[2], -v[1]) : null; };
let began = performance.now();
function show(i) {
  current = scenes[i];
  began = performance.now();
  for (const b of current.balls) b.last = null;
  camera.position.copy(vec("eye") || current.eye); controls.target.copy(vec("at") || current.target); controls.update();
  document.querySelectorAll("#buttons button").forEach((b, j) => b.classList.toggle("on", j === i));
}
const buttons = document.getElementById("buttons");
scenes.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.name; b.onclick = () => show(i); buttons.appendChild(b); });
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
show(Math.min(scenes.length - 1, Math.max(0, +(new URLSearchParams(location.search).get("scene") || 0))));
// the marbles' time: it runs, waits two seconds at the end and starts again; ?t=MS holds it still
const held = ask.get("t") === null ? null : +ask.get("t");
const clock = document.getElementById("clock");
(function loop() {
  requestAnimationFrame(loop);
  if (current.balls.length) {
    let ms = held !== null ? held : performance.now() - began;
    if (held === null && ms > current.end + 2000) { began = performance.now(); ms = 0; }
    for (const b of current.balls) {
      const p = marbleAt(b.way, ms);
      b.mesh.visible = !!p;
      if (!p) { b.last = null; continue; }
      // it rolls: turned about the level line across its way, by the way gone over its radius
      const was = b.last, dx = was ? p[0] - was[0] : 0, dy = was ? p[1] - was[1] : 0, gone = Math.hypot(dx, dy);
      if (!was || gone > 3) b.mesh.quaternion.identity();
      else if (gone > 1e-6) b.mesh.rotateOnWorldAxis(new THREE.Vector3(-dy / gone, 0, -dx / gone), gone / 0.68);
      // held still (?t=MS) it shows the turn it would have by then: the way gone so far
      if (held !== null && !was) {
        let far = 0;
        for (let k = 2; k < b.way.length && b.way[k][0] <= ms; k++) far += Math.hypot(b.way[k][1] - b.way[k - 1][1], b.way[k][2] - b.way[k - 1][2]);
        b.mesh.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), far / 0.68);
      }
      b.last = p;
      b.mesh.position.set(p[0], p[2] + 0.68, -p[1]);
    }
    clock.textContent = (Math.min(ms, current.end) / 1000).toFixed(1) + " s of " + (current.end / 1000).toFixed(1);
  } else clock.textContent = "";
  renderer.render(current.scene, camera);
})();
</script>
